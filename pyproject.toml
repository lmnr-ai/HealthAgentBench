[project]
name = "healthagentbench"
version = "0.1.0"
description = "HealthAgentBench (Laminar fork) — TREC Clinical Trials patient-to-trial matching tasks"
readme = "README.md"
authors = [
    { name = "Sheng Zhang", email = "shezhan@microsoft.com" },
    { name = "Qianchu Liu", email = "qianchuliu@microsoft.com" },
    { name = "Guanghui Qin", email = "qin.guanghui@microsoft.com" },
    { name = "Jeya Maria Jose Valanarasu", email = "jevalanarasu@microsoft.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiolimiter>=1.2.1",
    "anthropic>=0.84.0",
    "filelock>=3.25.0",
    "harbor==0.8.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "remotezip>=0.12.3",
    "requests>=2.32.5",
    "rich>=14.3.3",
    "tenacity>=9.1.4",
    "tqdm>=4.67.1",
]

[project.scripts]
healthagentbench = "healthagentbench:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["healthagentbench*", "scripts*"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["results", ".venv", "__pycache__"]
markers = [
    "integration: marks tests that require external services such as Dockerized FHIR runtime",
]

[tool.ruff.lint]
# Enabled so the `# noqa` directives carried by the task files are meaningful
# rather than dead (ruff's RUF100 strips a `# noqa: X` when X isn't selected):
#   E402  the deliberate post-`sys.path` import in tests/test_trec_ct_roundtrip.py
#   S310  urlopen against the hard-coded, trusted trec.nist.gov URLs
extend-select = ["E402", "S310"]

[tool.ruff.lint.per-file-ignores]
# Upstream commits every task's verify.py non-executable with a shebang; test.sh
# runs it as `python verify.py`. Keeping the mode as-is preserves task diffs.
"**/verify.py" = ["EXE001"]
