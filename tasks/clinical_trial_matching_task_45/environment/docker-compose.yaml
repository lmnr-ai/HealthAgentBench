services:
  main:
    build:
      context: ..
      dockerfile: environment/Dockerfile
    image: ${COMPOSE_PROJECT_NAME}-img
    volumes:
      - workspace-data:/workspace/data
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      - PYTHONUNBUFFERED=1

  bootstrap:
    image: ${COMPOSE_PROJECT_NAME}-img
    volumes:
      # bootstrap.sh is bind-mounted into the bootstrap service ONLY (not baked
      # into the image), so the agent's main container can never read it. It
      # names the TREC source + qrels answer-key filename — provenance/answer
      # hints that must stay out of the agent's reach.
      - ./bootstrap.sh:/bootstrap.sh:ro
      - ../../../assets/clinical_trial_matching/assets/raw_cache:/data/_cache:rw
      # bootstrap writes the runtime-derived qrels.txt here; the host tests/
      # dir is what Harbor mounts at /tests during scoring. main never mounts it.
      - ../tests:/tests:rw
      # The download/extract scripts are mounted into the bootstrap ONLY (not
      # baked into the image), so the agent's main container can never read or
      # run them. extract_task_inputs.py can fetch the TREC qrels (answer key),
      # so it must stay out of the agent's reach.
      - ./fetch_trials.py:/opt/ctm/fetch_trials.py:ro
      - ./extract_task_inputs.py:/opt/ctm/extract_task_inputs.py:ro
      - workspace-data:/workspace/data
    command: ["/bin/bash", "/bootstrap.sh"]

volumes:
  workspace-data:
